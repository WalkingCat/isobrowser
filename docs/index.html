              content.appendChild(pre);
              toggleBtn.textContent = 'View';
              toggleBtn.title = 'View rendered';
            } else {
              pre.remove();
              content.appendChild(iframe);
              toggleBtn.textContent = 'Source';
              toggleBtn.title = 'View source';
            }
          });
          if (node.readFile) previewInnerHtmlWithSw(iframe, node, htmlText, ov);
          else previewHtmlWithSw(iframe, node, htmlText, ov);
          return;
        }

        const url = URL.createObjectURL(new Blob([data], type === 'pdf' ? { type: 'application/pdf' } : undefined));
        ov._url = url;
        let el;
        if (type === 'image') { el = document.createElement('img'); el.draggable = false; }
        else if (type === 'video') { el = document.createElement('video'); el.controls = true; }
        else if (type === 'pdf') { el = document.createElement('iframe'); }
        else { el = document.createElement('audio'); el.controls = true; }
        el.src = url;
        content.appendChild(el);
        if (type === 'image') {
          setupImageViewer(el, content, toggleBtn);
        } else if (type === 'video') {
          let vFit = true;
          applyMediaFit(el, true);
          toggleBtn.addEventListener('click', () => {
            vFit = !vFit;
            applyMediaFit(el, vFit);
            toggleBtn.textContent = vFit ? '1:1' : 'Fit';
          });
        } else {
          toggleBtn.style.display = 'none';
        }
      } catch (err) {
        if (gen !== previewGen) return;
        content.textContent = 'Failed to load preview: ' + err.message;
      }
    })();
  }

  // Tree: mount the node into its parent's children container (parent is always loaded before child in BFS)
  function appendTreeNode(node, depth, childBoxes, treeRoot) {
    const nodeEl = document.createElement('div');
    nodeEl.className = 'tree-node';
    const row = document.createElement('div');
    row.className = depth % 2 ? 'tree-row depth-odd' : 'tree-row';
    const name = document.createElement('span');
    name.className = 'tree-name';
    name.style.setProperty('--level', depth);
    if (node.isDir) {
      const span = document.createElement('span');
      span.className = 'dir';
      span.innerHTML = '📁 <span class="node-name">' + esc(node.name) + '</span>';
      span.title = node.name;
      span.addEventListener('click', () => toggleDir(node));
      name.appendChild(span);
      node.dirSpan = span;
      node.treeNameEl = name;
      if (!aifReader) {
        const pack = document.createElement('span');
        pack.className = 'preview-icon';
        pack.title = 'Pack & download';
        pack.textContent = '📦';
        pack.addEventListener('click', () => packDir(node));
        name.appendChild(pack);
        node.treePackEl = pack;
      }
      const spinner = document.createElement('span');
      spinner.className = 'loading-spinner hidden';
      spinner.innerHTML = '<span class="loading-ring"></span>';
      name.appendChild(spinner);
      node.treeLoadingEl = spinner;
    } else {
      const pt = previewTypeOf(node);
      name.innerHTML = '<span class="tree-main"><span class="file">' + fileIcon(node) + ' <a href="' + esc(fileLink(node.path)) + '" target="_blank" rel="noopener" title="' + esc(node.name) + '">' + esc(node.name) + '</a></span></span>'
        + (pt && !(pt === 'archive' && node._noBrowse) ? '<span class="preview-icon" title="' + (pt === 'archive' ? 'Browse' : 'Preview') + '">' + (pt === 'archive' ? '🔍' : '👁') + '</span>' : '');
      node.treeNameSpan = name;
      attachDownload(name.querySelector('a'), node);
      if (pt) name.querySelector('.preview-icon').addEventListener('click', () => openPreview(node, pt));
      setDescSpan(name, node);
    }
    const date = document.createElement('span');
    date.className = 'tree-date';
    date.textContent = node.date || '';
    const size = document.createElement('span');
    size.className = 'tree-size';
    size.textContent = node.isDir ? '' : fmtSize(node.size);
    node.treeSizeEl = size;
    row.append(name, size, date);
    nodeEl.appendChild(row);
    if (node.isDir) {
      const box = document.createElement('div');
      box.className = 'tree-children hidden';
      nodeEl.appendChild(box);
      childBoxes.set(node.path, box);
      node._childrenBox = box;
    }
    const parentBox = childBoxes.get(parentPathOf(node.path)) || treeRoot;
    parentBox.appendChild(nodeEl);
    nodeEl._node = node;
  }

  // Flat/filter shared: build a full-path row
  function makeFlatRow(node) {
    const row = document.createElement('div');
    row.className = 'tree-row';
    const name = document.createElement('span');
    name.className = 'tree-name';
    if (node.isDir) {
      name.innerHTML = aifReader
        ? '<span class="tree-main" title="' + esc(node.path) + '">📁 <span>' + esc(node.path) + '</span></span>'
        : '<span class="tree-main" title="' + esc(node.path) + '">📁 <span>' + esc(node.path) + '</span></span><span class="preview-icon" title="Pack & download">📦</span>';
      node.flatNameEl = name;
      if (!aifReader) {
        name.querySelector('.preview-icon').addEventListener('click', () => packDir(node));
        node.flatPackEl = name.querySelector('.preview-icon');
      }
      const spinner = document.createElement('span');
      spinner.className = 'loading-spinner hidden';
      spinner.innerHTML = '<span class="loading-ring"></span>';
      name.appendChild(spinner);
      node.flatLoadingEl = spinner;
    } else {
      const pt = previewTypeOf(node);
      name.innerHTML = '<span class="tree-main">' + fileIcon(node) + ' <a href="' + esc(fileLink(node.path)) + '" target="_blank" rel="noopener" title="' + esc(node.path) + '">' + esc(node.path) + '</a></span>'
        + (pt && !(pt === 'archive' && node._noBrowse) ? '<span class="preview-icon" title="' + (pt === 'archive' ? 'Browse' : 'Preview') + '">' + (pt === 'archive' ? '🔍' : '👁') + '</span>' : '');
      node.flatNameSpan = name;
      attachDownload(name.querySelector('a'), node);
      if (pt) name.querySelector('.preview-icon').addEventListener('click', () => openPreview(node, pt));
      setDescSpan(name, node);
    }
    const size = document.createElement('span');
    size.className = 'tree-size';
    size.textContent = node.isDir ? '' : fmtSize(node.size);
    node.flatSizeEl = size;
    const date = document.createElement('span');
    date.className = 'tree-date';
    date.textContent = node.date || '';
    row.append(name, size, date);
    return row;
  }

  function appendFlatRowTo(container, node) {
    container.appendChild(makeFlatRow(node));
  }

  // Flat progressive insert: Map<dir path, row>; insert new children after that row to keep DFS order
  function appendFlatProgressive(node, flatList, lastChild) {
    const row = makeFlatRow(node);
    const parent = parentPathOf(node.path);
    const anchor = lastChild.get(parent);
    if (anchor) anchor.after(row);
    else flatList.prepend(row);            // only the first root-level child
    lastChild.set(parent, row);
    if (node.isDir) lastChild.set(node.path, row);  // the directory itself anchors its children
  }

  function showView(name) {
    treeView.classList.toggle('hidden', name !== 'tree');
    flatView.classList.toggle('hidden', name !== 'flat');
    if (filterView) filterView.classList.toggle('hidden', name !== 'filter');
  }

  function applyMode() {
    showView(mode === 'tree' ? 'tree' : 'flat');
  }

  function applyFilter() {
    const kw = filterEl.value.trim().toLowerCase();
    if (!kw) { applyMode(); return; }
    if (!filterView) {
      const fv = makeView();
      filterView = fv.view; filterList = fv.list;
      filterView.classList.add('grid-table', 'flat-view');
      resultEl.appendChild(filterView);
    }
    filterList.innerHTML = '';
    for (const n of allNodes) {
      if (n.path.toLowerCase().includes(kw)) appendFlatRowTo(filterList, n);
    }
    showView('filter');
  }

  async function parse(file, handle) {
    currentFile = file || null;
    currentHandle = handle || null;
    const url = file ? file.name : urlEl.value.trim();
    if (!url) {
      mainStatusEl.textContent = 'Please paste an ISO/BIN/MDF link first.';
      return;
    }
    const gen = ++parseGen;   // the latest parse wins
    currentUrl = file ? 'file:///' + file.name : url;
    try {
      if (currentFile) localStorage.removeItem('isobrowser:url');
      else localStorage.setItem('isobrowser:url', url);
    } catch (e) {}
    hideUrlDialog();
    urlLink.href = currentUrl;
    urlLink.textContent = fileNameFromUrl(url);
    document.title = fileNameFromUrl(url) + ' - ISOBrowser';
    mainStatusEl.textContent = 'Reading...';
    mainStatusEl.classList.add('loading');
    filterEl.value = '';
    filterClearEl.classList.add('hidden');
    resultEl.innerHTML = '';
    const tv = makeView(), fv = makeView();
    treeView = tv.view; treeRoot = tv.list;
    flatView = fv.view; flatList = fv.list;
    treeView.classList.add('grid-table', 'tree-view');
    flatView.classList.add('grid-table', 'flat-view');
    filterView = null; filterList = null;
    resultEl.append(treeView, flatView);
    applyMode();
    childBoxes = new Map([['', treeRoot]]);
    lastChild = new Map();
    allNodes = [];
    dirSize = new Map();
    nodeByPath = new Map();

    let dirCount = 0, fileCount = 0, totalBytes = 0;
    try {
      aifReader = null;   // reset; a fresh AIF reader is created below when needed
      isoReadCache.clear();
      const fmt = await detectFormat(url);
      if (gen !== parseGen) return;
      if (!fmt) {
        throw new Error('Unrecognized archive format (ISO 9660 or ZIP expected)');
      }
      if (fmt.type === 'zip') {
        archiveType = 'zip';
        await parseZip(url, gen);
        return;
      }
      // Mount an HFS catalog into the tree (shared by raw-HFS and HFS-in-AIF).
      async function mountHfs(hfsRead, vol) {
        let counter = 0;
        const dirStack = [];
        for await (const e of HFS.catalogEntries(hfsRead, vol)) {
          if (gen !== parseGen) return false;
          const depth = e.path.split('/').filter(Boolean).length;
          const child = { name: e.name, path: e.path, isDir: e.isDir, size: e.size, depth, date: '' };
          if (!e.isDir) { child.extents = e.extents; child.type = e.type; child.dataSize = e.dataSize; }
          allNodes.push(child);
          nodeByPath.set(child.path, child);
          appendTreeNode(child, depth, childBoxes, treeRoot);
          appendFlatProgressive(child, flatList, lastChild);
          if (child.isDir) {
            dirSize.set(child.path, 0);
            dirCount++;
            const pid = e.parentID, cid = e.cnid;
            const remaining = [];
            for (const d of dirStack) {
              if (d.subtreeEnd <= pid) setDirLoading(d.node, false);
              else remaining.push(d);
            }
            dirStack.length = 0;
            dirStack.push(...remaining);
            for (let i = dirStack.length - 1; i >= 0; i--) {
              if (dirStack[i].parentId === pid) { dirStack[i].subtreeEnd = cid; break; }
            }
            let subtreeEnd = Infinity;
            for (let i = dirStack.length - 1; i >= 0; i--) {
              if (dirStack[i].cnid === pid) { subtreeEnd = dirStack[i].subtreeEnd; break; }
            }
            setDirLoading(child, true);
            dirStack.push({ node: child, cnid: cid, parentId: pid, subtreeEnd });
          } else {
            onFileAdded(child, dirSize, nodeByPath);
            fileCount++;
            totalBytes += child.size;
          }
          if ((++counter % 40) === 0) {
            mainStatusEl.textContent = fmtStatus(totalBytes, fileCount, dirCount, vol.volName);
            await new Promise(r => setTimeout(r, 0));
          }
        }
        if (gen !== parseGen) return false;
        mainStatusEl.textContent = fmtStatus(totalBytes, fileCount, dirCount, vol.volName);
        mainStatusEl.classList.remove('loading');
        while (dirStack.length) setDirLoading(dirStack.pop().node, false);
        const ordered = [];
        (function walk(container) {
          for (const el of container.children) {
            const n = el._node;
            if (!n) continue;
            ordered.push(n);
            const box = n.isDir ? childBoxes.get(n.path) : null;
            if (box) walk(box);
          }
        })(treeRoot);
        allNodes = ordered;
        await applyFileDescriptions();
        return true;
      }
      // Mount a UDF catalog into the tree (BFS, sorted entries, post-order completion).
      async function mountUdf(read, vol) {
        const queue = [{ loc: vol.rootLoc, path: '', depth: 0 }];
        const pending = new Map();
        const lookup = (p) => nodeByPath.get(p);
        while (queue.length > 0) {
          if (gen !== parseGen) return false;
          const dir = queue.shift();
          const entries = await UDF.readDir(read, vol, dir.loc);
          if (gen !== parseGen) return false;
          let subdirs = 0;
          for (const e of entries) {
            const path = dir.path === '' ? '/' + e.name : dir.path + '/' + e.name;
            const child = { name: e.name, path, isDir: e.isDir, size: e.size, depth: dir.depth + 1, date: '' };
            if (!e.isDir) child.extents = e.extents;
            allNodes.push(child);
            nodeByPath.set(child.path, child);
            appendTreeNode(child, child.depth, childBoxes, treeRoot);
            appendFlatProgressive(child, flatList, lastChild);
            if (child.isDir) {
              dirSize.set(child.path, 0);
              dirCount++;
              subdirs++;
              setDirLoading(child, true);
              queue.push({ loc: e.loc, path, depth: dir.depth + 1 });
            } else {
              onFileAdded(child, dirSize, nodeByPath);
              fileCount++;
              totalBytes += child.size;
            }
          }
          pending.set(dir.path, subdirs);
          if (subdirs === 0) completeDir(pending, lookup, dir.path);
          mainStatusEl.textContent = fmtStatus(totalBytes, fileCount, dirCount, 'UDF');
          mainStatusEl.classList.add('loading');
          await new Promise(r => setTimeout(r, 0));
        }
        if (gen !== parseGen) return false;
        mainStatusEl.textContent = fmtStatus(totalBytes, fileCount, dirCount, 'UDF');
        mainStatusEl.classList.remove('loading');
        const ordered = [];
        (function walk(container) {
          for (const el of container.children) {
            const n = el._node;
            if (!n) continue;
            ordered.push(n);
            const box = n.isDir ? childBoxes.get(n.path) : null;
            if (box) walk(box);
          }
        })(treeRoot);
        allNodes = ordered;
        await applyFileDescriptions();
        return true;
      }
      if (fmt.type === 'udf') {
        archiveType = 'udf';
        await loadUdf();
        const udfRead = makeCachedRead((off, len) => readRange(url, off, len));
        const vol = await UDF.detect(udfRead);
        if (gen !== parseGen) return;
        if (!vol) throw new Error('UDF anchor found, but volume parsing failed');
        udfVol = vol;
        await mountUdf(udfRead, vol);
        return;
      }
      if (fmt.type === 'hfs') {
        archiveType = 'hfs';
        await loadHfs();
        const hfsRead = (off, len) => readRange(url, off, len);
        const vol = await HFS.detect(hfsRead);
        if (gen !== parseGen) return;
        if (!vol) throw new Error('Apple Partition Map found, but no HFS Master Directory Block ("BD")');
        hfsVol = vol;
        await mountHfs(hfsRead, vol);
        return;
      }
      if (fmt.type === 'aif') {
        await loadAif();
        aifReader = await AIF.open((start, length) => readRange(url, start, length), detectProbe);
        if (gen !== parseGen) return;

        // Probe the filesystem inside the container.
        const s16 = await aifReader.readSector(16);
        const s0 = await aifReader.readSector(0);
        let s256 = null;
        try { s256 = await aifReader.readSector(256); } catch (e) {}
        const isUdf = s256 && s256[0] === 0x02 && s256[1] === 0x00;
        const isIso = s16 && ascii(s16.subarray(1, 6)) === 'CD001';
        const isHfs = s0 && ((s0[512] === 0x50 && s0[513] === 0x4D) || (s0[1024] === 0x42 && s0[1025] === 0x44));

        if (isUdf) {
          archiveType = 'udf';
          await loadUdf();
          const udfRead = makeCachedRead(aifByteRead);
          const vol = await UDF.detect(udfRead);
          if (gen !== parseGen) return;
          if (!vol) throw new Error('UDF anchor found in AIF, but volume parsing failed');
          udfVol = vol;
          await mountUdf(udfRead, vol);
          return;
        } else if (isIso) {
          archiveType = 'iso';
          sectorSize = 2048;
          dataOffset = 0;
        } else if (isHfs) {
          archiveType = 'hfs';
          await loadHfs();
          const vol = await HFS.detect(aifByteRead);
          if (gen !== parseGen) return;
          if (!vol) throw new Error('HFS signature found in AIF, but no HFS Master Directory Block ("BD")');
          hfsVol = vol;
          await mountHfs(aifByteRead, vol);
          return;
        } else {
          const sig = s16 ? ascii(s16.subarray(0, 8)) : '(no sector 16)';
          let what = 'unknown filesystem';
          if (s0 && s0[510] === 0x55 && s0[511] === 0xAA) what = 'bootable volume (FAT/NTFS/exFAT?)';
          throw new Error('Unsupported filesystem inside AIF: ' + what + ' (signature "' + sig + '")');
        }
      } else {
        archiveType = 'iso';
        sectorSize = fmt.sectorSize;
        dataOffset = fmt.dataOffset;
      }
      const { pvd, svd } = await readVolumeDescriptors(url);
      if (gen !== parseGen) return;
      if (!pvd) {
        throw new Error('Not an ISO 9660 filesystem (primary volume descriptor "CD001" not found)');
      }
      isJoliet = !!svd;
      const rootDesc = svd || pvd;
      const vol = isJoliet ? decodeUCS2(rootDesc.subarray(40, 72)).trim() : ascii(rootDesc.subarray(40, 72)).trim();
      rootLba = u32(rootDesc, 156 + 2);
      rootSize = u32(rootDesc, 156 + 10);
      const useRR = !isJoliet; // Joliet names are already long enough; otherwise fall back to Rock Ridge

      // Breadth-first read; display is mounted into parent/child nesting by appendTreeNode
      const queue = [{ lba: rootLba, size: rootSize, path: '', depth: 0 }];
      const pending = new Map();
      const lookup = (p) => nodeByPath.get(p);
      while (queue.length > 0) {
        if (gen !== parseGen) return;   // don't send a new request
        const node = queue.shift();
        const data = await readDataCached(url, node.lba, node.size);
        if (gen !== parseGen) return;   // finish the current request, then stop
        const entries = parseDirEntries(data, isJoliet, useRR);
        let subdirs = 0;
        for (const e of entries) {
          const path = node.path === '' ? '/' + e.name : node.path + '/' + e.name;
          const child = { name: e.name, path, isDir: e.isDir, lba: e.lba, size: e.size, date: e.date, depth: node.depth };
          allNodes.push(child);
          appendTreeNode(child, child.depth, childBoxes, treeRoot);
          appendFlatProgressive(child, flatList, lastChild);
          nodeByPath.set(child.path, child);
          if (child.isDir) { dirSize.set(child.path, 0); dirCount++; subdirs++; setDirLoading(child, true); queue.push({ lba: e.lba, size: e.size, path, depth: node.depth + 1 }); }
          else { onFileAdded(child, dirSize, nodeByPath); fileCount++; totalBytes += child.size; }
        }
        pending.set(node.path, subdirs);
        if (subdirs === 0) completeDir(pending, lookup, node.path);
        mainStatusEl.textContent = fmtStatus(totalBytes, fileCount, dirCount, vol);
        await new Promise(r => setTimeout(r, 0));
      }

      // Reorder allNodes into depth-first order for filtering (flat list is already inserted progressively)
      const ordered = [];
      (function walk(container) {
        for (const el of container.children) {
          const node = el._node;
          if (!node) continue;
          ordered.push(node);
          const box = node.isDir ? childBoxes.get(node.path) : null;
          if (box) walk(box);
        }
      })(treeRoot);
      allNodes = ordered;
      await applyFileDescriptions();

      mainStatusEl.textContent = fmtStatus(totalBytes, fileCount, dirCount, vol);
      mainStatusEl.classList.remove('loading');
    } catch (e) {
      if (gen !== parseGen) return;  // superseded by a new parse
      mainStatusEl.textContent = '';
      mainStatusEl.classList.remove('loading');
      resultEl.innerHTML = '<div style="color:#c00">Parse failed: ' + esc(e.message) + '</div>';
    }
  }

  modeTree.addEventListener('click', () => {
    mode = 'tree';
    modeTree.classList.add('active');
    modeFlat.classList.remove('active');
    applyFilter();
  });
  modeFlat.addEventListener('click', () => {
    mode = 'flat';
    modeFlat.classList.add('active');
    modeTree.classList.remove('active');
    applyFilter();
  });
  filterEl.addEventListener('input', () => {
    filterClearEl.classList.toggle('hidden', !filterEl.value);
    applyFilter();
  });
  filterClearEl.addEventListener('click', () => {
    filterEl.value = '';
    filterClearEl.classList.add('hidden');
    applyFilter();
  });
  parseBtn.addEventListener('click', () => parse());
  pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) urlEl.value = text.trim();
    } catch (e) {}
  });
  urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') parse(); });
  openDlg.addEventListener('click', showUrlDialog);
  openFile.addEventListener('click', async () => {
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{ description: 'Archives', accept: { 'application/octet-stream': ['.iso', '.bin', '.mdf', '.zip'] } }]
        });
        parse(await handle.getFile(), handle);
      } catch (e) {}
    } else {
      fileInput.click();
    }
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    parse(file);
  });
  urlDlg.querySelector('.modal-close').addEventListener('click', hideUrlDialog);
  urlDlg.addEventListener('click', (e) => { if (e.target === urlDlg) hideUrlDialog(); });
  packStart.addEventListener('click', packRun);
  packCancel.addEventListener('click', packCancelClicked);
  packClose.addEventListener('click', packCancelClicked);
  packDlg.addEventListener('click', (e) => { if (e.target === packDlg) packCancelClicked(); });
  showUrlDialog();

  // Surface SW-intercepted requests in this page's console
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'log') {
        console.log('[ISOBrowser SW]', e.data.method, e.data.url);
        try {
          const u = new URL(e.data.url);
          const idx = u.pathname.indexOf('/_iso/');
          if (idx !== -1) {
            const rest = u.pathname.slice(idx + 6);
            const slash = rest.indexOf('/');
            const sessionId = slash === -1 ? rest : rest.slice(0, slash);
            const path = slash === -1 ? '' : decodeURIComponent(rest.slice(slash + 1));
            if (currentPreview && currentPreview._sessionId === sessionId && currentPreview._statusEl) {
              currentPreview._statusEl.textContent = 'Load ' + path;
            }
          }
        } catch (err) {}
      } else if (e.data && e.data.type === 'session-expired') {
        alert('Preview session expired (the Service Worker was restarted and the local file cannot be persisted).\nPlease re-open the file.');
      }
    });
    window.addEventListener('pagehide', () => {
      if (currentPreview && currentPreview._sessionId && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'clear-session', sessionId: currentPreview._sessionId });
      }
    });
  }

  // Draggable divider between the file list and the preview pane
  const dividerEl = document.getElementById('divider');
  const paneEl = document.getElementById('preview-pane');
  dividerEl.addEventListener('pointerdown', (e) => {
    if (paneEl.classList.contains('hidden')) return;
    e.preventDefault();
    dividerEl.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    const startW = paneEl.getBoundingClientRect().width;
    dividerEl.classList.add('dragging');
    const onMove = (ev) => {
      const w = Math.max(200, Math.min(window.innerWidth * 0.85, startW + (startX - ev.clientX)));
      paneWidthPx = w;
      paneEl.style.flexBasis = w + 'px';
    };
    const onUp = () => {
      dividerEl.classList.remove('dragging');
      dividerEl.removeEventListener('pointermove', onMove);
      dividerEl.removeEventListener('pointerup', onUp);
      dividerEl.removeEventListener('pointercancel', onUp);
    };
    dividerEl.addEventListener('pointermove', onMove);
    dividerEl.addEventListener('pointerup', onUp);
    dividerEl.addEventListener('pointercancel', onUp);
  });

  // Register the Service Worker for HTML preview (needs HTTPS or localhost)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
